<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/img/logo_rbg.png">
    <link rel="stylesheet" href="./styles/style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Gloria+Hallelujah&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

    <title>Erectüm</title>
</head>

<body>

    <header class="header">
        <nav class="navbar">
            <img src="./assets/img/logo_rbg.png" alt="EretÜm">
            <a href="#merch" class="logo">Merch soon...</a>
            <a href="#music">Music</a>
            <a href="#videos">Videos</a>
        </nav>
    </header>
    <!-- BANNER -->
    <section class="banner">
        <img src="./assets/img/banner.png" alt="Banner de la banda">

        <div class="banner-content">
            <p class="new-release">★ NEW RELEASE ★</p>

            <a href="https://www.youtube.com/watch?v=RPMoI8a1UoY&list=RDRPMoI8a1UoY&start_radio=1"
            class="btn-escuchar"
            target="_blank"
            rel="noopener noreferrer">
                ESCUCHAR AHORA
            </a>
        </div>
    </section>
    <main>
        <section id="merch" class="merch-section">

            <h2 class="merch-title">MERCH</h2>
            <p class="merch-subtitle">WEAR THE SOUND.</p>

            <div class="merch-container">

                <!-- Producto -->
                <div class="merch-card">

                    <div class="merch-image-container">
                        <span class="merch-tag">NEW DROP</span>

                        <img
                            id="playera-img"
                            src="./assets/img/playera_frente.png"
                            alt="Playera negra - vista frontal"
                        >

                        <span id="playera-vista" class="vista-label">
                            FRENTE
                        </span>
                    </div>

                    <!-- Información -->
                    <div class="merch-info">

                        <p class="merch-category">OFFICIAL MERCH</p>

                        <h3>PLAYERA OVERSIZE</h3>

                        <p class="merch-description">
                            Playera con logotipo alternativo de Erectüm, <br>
                            Algodón suave, corte cómodo y estilo rock.
                        </p>

                        <p class="merch-price">precio por confirmar</p>

                        <button
                            type="button"
                            id="btn-cambiar"
                            class="btn-cambiar"
                            aria-pressed="false"
                        >
                            ↻ VER PARTE TRASERA
                        </button>

                        <p class="btn-comprar">
                            Proximamente
                        </p>

                    </div>

                </div>

            </div>

        </section>

        <section id="music">
            <!-- Aquí irá tu sección de música -->
        </section>

        <section id="videos">
            <!-- Aquí irán tus videos -->
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 - All rights reserved.</p>
    </footer>
<script src="./js/main.js"></script>
</body>
</html>
